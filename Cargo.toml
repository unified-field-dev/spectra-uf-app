[workspace]
resolver = "2"
members = [
    "spectra-app",
    "uf-integrations",
    "uf-product-macros",
    "uf-ssr",
    "uf-app-registry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"
significant_drop_tightening = "allow"
future_not_send = "allow"
doc_markdown = "allow"
use_self = "allow"
needless_pass_by_value = "allow"
missing_const_for_fn = "allow"
option_if_let_else = "allow"
too_many_lines = "allow"
map_unwrap_or = "allow"
redundant_closure_for_method_calls = "allow"
single_match_else = "allow"
match_wildcard_for_single_variants = "allow"
items_after_statements = "allow"
redundant_clone = "allow"
unused_async = "allow"
used_underscore_binding = "allow"
uninlined_format_args = "allow"
cast_possible_truncation = "allow"
implicit_clone = "allow"
trait_duplication_in_bounds = "allow"
option_option = "allow"
unnecessary_wraps = "allow"
unnecessary_trailing_comma = "allow"
elidable_lifetime_names = "allow"
trivially_copy_pass_by_ref = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
ref_option = "allow"
manual_let_else = "allow"
cognitive_complexity = "allow"
match_same_arms = "allow"
cast_lossless = "allow"
cast_precision_loss = "allow"
unnested_or_patterns = "allow"
too_long_first_doc_paragraph = "allow"
assigning_clones = "allow"
default_trait_access = "allow"
derive_partial_eq_without_eq = "allow"
collection_is_never_read = "allow"
if_not_else = "allow"
ignored_unit_patterns = "allow"
fn_params_excessive_bools = "allow"
semicolon_if_nothing_returned = "allow"
struct_field_names = "allow"
redundant_pub_crate = "allow"
large_types_passed_by_value = "allow"
enum_glob_use = "allow"
unreadable_literal = "allow"

[workspace.dependencies]
leptos = { version = "0.8.20", default-features = false, features = ["nightly"] }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false, features = ["nightly"] }
leptos_axum = { version = "0.8", default-features = false }
leptos_config = { version = "0.8", default-features = false }
leptos_dom = { version = "0.8", default-features = false }
leptos_integration_utils = { version = "0.8", default-features = false }
leptos_macro = { version = "0.8", default-features = false }
leptos_server = { version = "0.8", default-features = false }

icondata = { version = "0.4.0", default-features = false, features = ["ant-design-icons", "box-icons", "lucide"] }
icondata_core = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
turf = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind", "serde"] }

spectra-core = { package = "uf-spectra-core", version = "0.1.0", default-features = false }
spectra = { package = "uf-spectra", version = "0.1.0", default-features = false, features = ["mem"] }
gauge = { git = "https://github.com/deathbreakfast/gauge", branch = "feat/crates-io-uf-deps", default-features = false }
higgs = { git = "https://github.com/deathbreakfast/valence-platform", branch = "feat/crates-io-uf-deps", default-features = false }
uf-host = { git = "https://github.com/deathbreakfast/valence-platform", branch = "feat/crates-io-uf-deps", default-features = false }
uf-identity = { git = "https://github.com/deathbreakfast/valence-platform", branch = "feat/crates-io-uf-deps" }
valence = { package = "uf-valence", version = "0.1.1", default-features = false, features = ["mem", "sqlite"] }

orbital = { package = "orbital-ui", git = "https://github.com/deathbreakfast/orbital", branch = "fix/crates-io-publish", default-features = false }
orbital-macros = { git = "https://github.com/deathbreakfast/orbital", branch = "fix/crates-io-publish" }
orbital-datatable = { git = "https://github.com/deathbreakfast/orbital", branch = "fix/crates-io-publish", default-features = false }
orbital-charts = { git = "https://github.com/deathbreakfast/orbital", branch = "fix/crates-io-publish", default-features = false }

uf-integrations = { path = "uf-integrations", default-features = false }
uf-product-macros = { path = "uf-product-macros" }
uf-ssr = { path = "uf-ssr", default-features = false }
uf-app-registry = { path = "uf-app-registry" }
inventory = "0.3"

# crates.io uf-valence-codegen emits side-effect hooks; stubs until core republish
[patch.crates-io]
uf-valence-core = { version = "0.1.1" }
