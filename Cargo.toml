[workspace]
resolver = "2"
members = [
    "spectra-app",
    "uf-integrations",
    "uf-product-macros",
    "uf-ssr",
    "uf-app-registry",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
missing_docs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"

[workspace.dependencies]
leptos = { version = "0.8.20", default-features = false, features = ["nightly"] }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false, features = ["nightly"] }
leptos_axum = { version = "0.8", default-features = false }
leptos_config = { version = "0.8", default-features = false }
leptos_dom = { version = "0.8", default-features = false }
leptos_integration_utils = { version = "0.8", default-features = false }
leptos_macro = { version = "0.8", default-features = false }
leptos_server = { version = "0.8", default-features = false }

icondata = { version = "0.4.0", default-features = false, features = ["ant-design-icons", "box-icons", "lucide"] }
icondata_core = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
turf = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind", "serde"] }

spectra-core = { package = "uf-spectra-core", version = "0.1.0", default-features = false }
spectra = { package = "uf-spectra", version = "0.1.0", default-features = false, features = ["mem"] }
gauge = { git = "https://github.com/deathbreakfast/gauge", branch = "feat/crates-io-uf-deps", default-features = false }
higgs = { git = "https://github.com/deathbreakfast/valence-platform", branch = "feat/crates-io-uf-deps", default-features = false }
uf-host = { git = "https://github.com/deathbreakfast/valence-platform", branch = "feat/crates-io-uf-deps", default-features = false }
uf-identity = { git = "https://github.com/deathbreakfast/valence-platform", branch = "feat/crates-io-uf-deps" }
valence = { package = "uf-valence", version = "0.1.1", default-features = false, features = ["mem", "surreal"] }

orbital = { package = "orbital-ui", git = "https://github.com/deathbreakfast/orbital", branch = "fix/crates-io-publish", default-features = false }
orbital-macros = { git = "https://github.com/deathbreakfast/orbital", branch = "fix/crates-io-publish" }
orbital-datatable = { git = "https://github.com/deathbreakfast/orbital", branch = "fix/crates-io-publish", default-features = false }
orbital-charts = { git = "https://github.com/deathbreakfast/orbital", branch = "fix/crates-io-publish", default-features = false }

uf-integrations = { path = "uf-integrations", default-features = false }
uf-product-macros = { path = "uf-product-macros" }
uf-ssr = { path = "uf-ssr", default-features = false }
uf-app-registry = { path = "uf-app-registry" }
inventory = "0.3"
wasm-bindgen = "=0.2.126"

