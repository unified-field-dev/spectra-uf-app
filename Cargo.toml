[workspace]
resolver = "2"
members = [
    "spectra-app",
    "spectra-backend",
    "spectra-uf-app-e2e",
    "examples/protected-spectra-host",
]

[[workspace.metadata.leptos]]
name = "spectra-uf-app-e2e"
output-name = "spectra-uf-app-e2e"
bin-package = "spectra-uf-app-e2e"
lib-package = "spectra-uf-app-e2e"
site-root = "spectra-uf-app-e2e/site"
site-pkg-dir = "pkg"
style-file = "spectra-uf-app-e2e/style/main.scss"
assets-dir = "spectra-uf-app-e2e/public"
end2end-dir = "spectra-uf-app-e2e/end2end"
end2end-cmd = "npm test"
# Clear of lepton kit (:3120), lepton-uf-app (:3140), gauge (:3150), neutrino (:3160),
# boson (:3170), chronon (:3180), photon (:3190).
site-addr = "127.0.0.1:3200"
reload-port = 3201
bin-features = ["ssr"]
lib-features = ["hydrate"]
bin-default-features = false
lib-default-features = false
disable-erase-components = true
lib-profile-dev = "wasm-release"
lib-profile-release = "wasm-release"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Sean O'Rourke"]
repository = "https://github.com/unified-field-dev/spectra-uf-app"
homepage = "https://github.com/unified-field-dev/spectra-uf-app"
documentation = "https://github.com/unified-field-dev/spectra-uf-app"

[workspace.lints.rust]
missing_docs = "deny"
# leptos-lints (Dylint) names are unknown to rustc/clippy alone
unknown_lints = "allow"
leptos_print_stdout = "deny"
leptos_event_target = "deny"
leptos_event_target_value = "deny"
leptos_unscoped_spawn = "deny"

[workspace.metadata.dylint]
libraries = [{ git = "https://github.com/leptos-rs/leptos-lints", tag = "v0.1.2" }]

[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
# TypedBuilder (Leptos props) emits empty enums under clippy --all-targets.
empty_enums = "allow"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "thin"
codegen-units = 1
debug = false

# Avoid rust-lld R_X86_64_32 out-of-range on ring debug sections during cargo-leptos host link.
[profile.dev]
debug = 1

[workspace.dependencies]
leptos = { version = "0.8.20", default-features = false, features = ["nightly"] }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false, features = ["nightly"] }
leptos_axum = { version = "0.8", default-features = false }
leptos_config = { version = "0.8", default-features = false }
leptos_dom = { version = "0.8", default-features = false }
leptos_macro = { version = "0.8", default-features = false }
leptos_server = { version = "0.8", default-features = false }

icondata = { version = "0.4.0", default-features = false, features = ["ant-design-icons", "box-icons", "lucide"] }
icondata_core = "0.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
turf = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind", "serde"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
axum = { version = "0.8.4", default-features = false }
anyhow = "1"
async-trait = "0.1"
log = "0.4"
tower-sessions = "0.14.0"
tower-http = { version = "0.6", features = ["fs"] }
simple_logger = "5"
any_spawner = { version = "0.3", features = ["tokio"] }
wasm-bindgen = "=0.2.126"
web-sys = { version = "=0.3.103", features = ["CssStyleDeclaration", "Document", "DomRect", "Element", "EventTarget", "HtmlElement", "MediaQueryList", "Node", "Storage", "Window"] }
uuid = { version = "1", features = ["v4"] }

spectra-core = { package = "uf-spectra-core", git = "https://github.com/unified-field-dev/Spectra", branch = "main", default-features = false }
spectra = { package = "uf-spectra", git = "https://github.com/unified-field-dev/Spectra", branch = "main", default-features = false, features = ["mem"] }
gauge = { git = "https://github.com/unified-field-dev/gauge", branch = "main", default-features = false }
higgs = { git = "https://github.com/unified-field-dev/higgs", branch = "main", default-features = false }
higgs-host = { git = "https://github.com/unified-field-dev/higgs", branch = "main", default-features = false }
higgs-identity = { git = "https://github.com/unified-field-dev/higgs", branch = "main" }
valence = { package = "uf-valence", git = "https://github.com/unified-field-dev/valence", branch = "main", default-features = false, features = ["mem", "sqlite"] }

orbital = { package = "orbital-ui", git = "https://github.com/unified-field-dev/orbital", branch = "main", default-features = false }
orbital-macros = { path = "../../L0-upstream-cores/orbital/orbital-macros" }
orbital-datatable = { git = "https://github.com/unified-field-dev/orbital", branch = "main", default-features = false }
orbital-charts = { git = "https://github.com/unified-field-dev/orbital", branch = "main", default-features = false }

# Shared with embedded host / other uf-apps (avoids lockfile path collisions).
uf-integrations = { git = "https://github.com/unified-field-dev/unified-field-product", branch = "main", default-features = false }
uf-product-macros = { git = "https://github.com/unified-field-dev/unified-field-product", branch = "main" }
uf-product = { git = "https://github.com/unified-field-dev/unified-field-product", branch = "main", default-features = false }
uf-help = { git = "https://github.com/unified-field-dev/unified-field-product", branch = "main", default-features = false }
uf-help-macros = { git = "https://github.com/unified-field-dev/unified-field-product", branch = "main" }
lepton-shell = { git = "https://github.com/unified-field-dev/lepton-uf-app", branch = "main", default-features = false }
lepton = { git = "https://github.com/unified-field-dev/lepton", branch = "main", default-features = false }
inventory = "0.3"

# Unify deathbreakfast chronon-coordinator pins onto uf-dev git.
[patch."https://github.com/deathbreakfast/chronon-coordinator"]
chronon-coordinator = { git = "https://github.com/unified-field-dev/chronon-coordinator", branch = "main" }

# Local monorepo Orbital (CardContentInset, sample_series_for_width).
[patch."https://github.com/unified-field-dev/orbital"]
orbital-ui = { path = "../../L0-upstream-cores/orbital/orbital" }
orbital-macros = { path = "../../L0-upstream-cores/orbital/orbital-macros" }
orbital-datatable = { path = "../../L0-upstream-cores/orbital/orbital-datatable" }
orbital-charts = { path = "../../L0-upstream-cores/orbital/orbital-charts" }
orbital-data = { path = "../../L0-upstream-cores/orbital/orbital-data" }
orbital-shell = { path = "../../L0-upstream-cores/orbital/orbital-shell" }
orbital-core-components = { path = "../../L0-upstream-cores/orbital/orbital-core-components" }
orbital-base-components = { path = "../../L0-upstream-cores/orbital/orbital-base-components" }
orbital-primitives = { path = "../../L0-upstream-cores/orbital/orbital-primitives" }
orbital-theme = { path = "../../L0-upstream-cores/orbital/orbital-theme" }
orbital-paging = { path = "../../L0-upstream-cores/orbital/orbital-paging" }
orbital-motion = { path = "../../L0-upstream-cores/orbital/orbital-motion" }
orbital-discussion = { path = "../../L0-upstream-cores/orbital/orbital-discussion" }
orbital-history = { path = "../../L0-upstream-cores/orbital/orbital-history" }
orbital-markdown = { path = "../../L0-upstream-cores/orbital/orbital-markdown" }
orbital-style = { path = "../../L0-upstream-cores/orbital/orbital-style" }
orbital-tree = { path = "../../L0-upstream-cores/orbital/orbital-tree" }
orbital-scheduler = { path = "../../L0-upstream-cores/orbital/orbital-scheduler" }
orbital-date-pickers = { path = "../../L0-upstream-cores/orbital/orbital-date-pickers" }

# Local monorepo Spectra (aggregate_event_rows + mem/sqlite query_aggregate).
[patch."https://github.com/unified-field-dev/Spectra"]
uf-spectra-core = { path = "../../L0-upstream-cores/spectra/spectra-core" }
uf-spectra = { path = "../../L0-upstream-cores/spectra/spectra" }
spectra-backend-mem = { path = "../../L0-upstream-cores/spectra/spectra-backend-mem" }
spectra-backend-sqlite = { path = "../../L0-upstream-cores/spectra/spectra-backend-sqlite" }
spectra-macros = { path = "../../L0-upstream-cores/spectra/spectra-macros" }
spectra-runtime = { path = "../../L0-upstream-cores/spectra/spectra-runtime" }

# Unify crates.io uf-valence / chronon / orbital onto the git tree.
[patch.crates-io]
uf-valence = { git = "https://github.com/unified-field-dev/valence", branch = "main" }
uf-valence-core = { git = "https://github.com/unified-field-dev/valence", branch = "main" }
uf-valence-codegen = { git = "https://github.com/unified-field-dev/valence", branch = "main" }
uf-valence-macros = { git = "https://github.com/unified-field-dev/valence", branch = "main" }
uf-valence-telemetry = { git = "https://github.com/unified-field-dev/valence", branch = "main" }
uf-valence-backend-mem = { git = "https://github.com/unified-field-dev/valence", branch = "main" }
uf-valence-backend-sqlite = { git = "https://github.com/unified-field-dev/valence", branch = "main" }
uf-valence-backend-sql = { git = "https://github.com/unified-field-dev/valence", branch = "main" }
uf-valence-schema-dsl = { git = "https://github.com/unified-field-dev/valence", branch = "main" }
chronon-core = { git = "https://github.com/unified-field-dev/chronon", branch = "main" }
chronon-executor = { git = "https://github.com/unified-field-dev/chronon", branch = "main" }
chronon-scheduler = { git = "https://github.com/unified-field-dev/chronon", branch = "main" }
chronon-telemetry = { git = "https://github.com/unified-field-dev/chronon", branch = "main" }
orbital-ui = { path = "../../L0-upstream-cores/orbital/orbital" }
orbital-macros = { path = "../../L0-upstream-cores/orbital/orbital-macros" }
orbital-datatable = { path = "../../L0-upstream-cores/orbital/orbital-datatable" }
orbital-charts = { path = "../../L0-upstream-cores/orbital/orbital-charts" }
orbital-data = { path = "../../L0-upstream-cores/orbital/orbital-data" }
orbital-shell = { path = "../../L0-upstream-cores/orbital/orbital-shell" }
orbital-core-components = { path = "../../L0-upstream-cores/orbital/orbital-core-components" }
orbital-base-components = { path = "../../L0-upstream-cores/orbital/orbital-base-components" }
orbital-primitives = { path = "../../L0-upstream-cores/orbital/orbital-primitives" }
orbital-theme = { path = "../../L0-upstream-cores/orbital/orbital-theme" }
orbital-paging = { path = "../../L0-upstream-cores/orbital/orbital-paging" }
orbital-motion = { path = "../../L0-upstream-cores/orbital/orbital-motion" }
