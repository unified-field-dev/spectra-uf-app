[package]
name = "protected-spectra-host"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Minimal protected /spectra host proving auth gate + schema index API"

[lints]
workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
http-body-util = "0.1"
serde_json = { workspace = true }
spectra-backend = { path = "../../spectra-backend" }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower = { version = "0.5", features = ["util"] }
