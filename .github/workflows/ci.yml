# PR / merge gate aligned with docs/VERIFICATION.md (spectra-backend + teaching
# host). Standalone checkout — UF deps resolve via git branch = main on
# unified-field-dev.
# spectra-app / Orbital UI compile stays local (see VERIFICATION.md).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_TARGET_DIR: target-spectra-uf-app
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: "0"
  RUST_BACKTRACE: 1
  # Leptos workspace deps enable the `nightly` feature.
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          components: rustfmt
      - name: cargo fmt --check
        run: >
          cargo fmt -p spectra-backend -p spectra-app -p protected-spectra-host
          -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          components: clippy
      # Preferred path from VERIFICATION.md (clippy -D warnings).
      - name: cargo clippy (spectra-backend + teaching host)
        run: |
          cargo clippy -p spectra-backend --all-targets -- -D warnings
          cargo clippy -p protected-spectra-host --all-targets -- -D warnings
      # Tracked debt: spectra-app clippy depends on the full Orbital / uf-product graph in CI.
      # Run locally when the UI graph is green; promote to required when warnings are zero.
      - name: cargo clippy (spectra-app SSR, non-blocking)
        continue-on-error: true
        run: cargo clippy -p spectra-app --features ssr --all-targets -- -D warnings

  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: cargo test (sibling-source UI contracts)
        run: cargo test -p spectra-backend --test workspace_members --test product_surface
      - name: cargo test (spectra-backend contracts)
        run: cargo test -p spectra-backend

  test-ssr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        run: bash scripts/ci-free-disk.sh
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: cargo test (spectra-app SSR unit tests)
        run: cargo test -p spectra-app --features ssr
      - name: cargo test (spectra-uf-app-e2e boundary)
        run: cargo test -p spectra-uf-app-e2e --features ssr --test boundary_contract

  test-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: cargo check + run (protected-spectra-host)
        run: |
          cargo check -p protected-spectra-host
          cargo run -p protected-spectra-host

  e2e:
    runs-on: ubuntu-latest
    # Cold leptos e2e (~setup + compile + suite); cap hung WASM boots.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        run: bash scripts/ci-free-disk.sh
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v4
        id: cargo-leptos-cache
        with:
          path: |
            ~/.cargo/bin/cargo-leptos
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: cargo-leptos-0.3.6-${{ runner.os }}
      - name: Install cargo-leptos
        if: steps.cargo-leptos-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-leptos --locked --version 0.3.6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: spectra-uf-app-e2e/end2end/package-lock.json
      - name: Install npm dependencies
        working-directory: spectra-uf-app-e2e/end2end
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        working-directory: spectra-uf-app-e2e/end2end
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-spectra-uf-app
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: spectra-uf-app-e2e/end2end
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps when cache hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: spectra-uf-app-e2e/end2end
        run: npx playwright install-deps chromium
      - name: cargo leptos end-to-end
        env:
          CI: true
        run: cargo leptos end-to-end --project spectra-uf-app-e2e
      - name: Upload Playwright artifacts on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-spectra-uf-app-${{ github.run_id }}
          path: |
            spectra-uf-app-e2e/end2end/playwright-report/
            spectra-uf-app-e2e/end2end/test-results/
          if-no-files-found: ignore

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: cargo doc (spectra-backend, deny broken intra-doc links)
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken-intra-doc-links"
        run: cargo doc -p spectra-backend --no-deps

  leptos-lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Free disk space
        run: bash scripts/ci-free-disk.sh
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: Install cargo-dylint
        run: |
          cargo install cargo-dylint --locked --version 6.0.1 --force
          cargo install dylint-link --locked --version 6.0.1 --force
      - name: Install leptos-lints nightly toolchain
        run: rustup toolchain install nightly-2025-05-14 --component rustc-dev,llvm-tools-preview
      - name: cargo dylint (spectra-app hydrate)
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
          RUSTFLAGS: "-D warnings -Zcrate-attr=feature(stdarch_x86_avx512)"
        run: cargo dylint --all -p spectra-app --no-deps -- --features hydrate
