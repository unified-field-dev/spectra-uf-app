# PR / merge gate aligned with docs/VERIFICATION.md (spectra-backend + teaching
# host). Path deps assume a Unified Field sibling checkout layout; CI places
# this repo under that path and shallow-clones siblings.
# spectra-app / Orbital UI compile stays local (see VERIFICATION.md).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 1
  CARGO_TARGET_DIR: target-spectra-uf-app
  RUST_BACKTRACE: 1
  # Leptos workspace deps enable the `nightly` feature.
  RUSTFLAGS: "-D warnings"
  UF_ROOT: unified-field
  APP_WD: unified-field/L4-composers/spectra-uf-app

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spectra-uf-app into unified-field layout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ env.APP_WD }}
      - name: Checkout path-dep / patch siblings
        run: |
          set -euo pipefail
          clone() {
            local repo="$1" dest="$2"
            git clone --depth 1 "https://github.com/deathbreakfast/${repo}.git" "${dest}"
          }
          clone valence "${UF_ROOT}/L0-upstream-cores/valence"
          clone orbital "${UF_ROOT}/L0-upstream-cores/orbital"
          clone chronon "${UF_ROOT}/L0-upstream-cores/chronon"
          clone photon "${UF_ROOT}/L0-upstream-cores/photon"
          clone boson "${UF_ROOT}/L0-upstream-cores/boson"
          clone spectra "${UF_ROOT}/L0-upstream-cores/spectra"
          clone higgs "${UF_ROOT}/L1-host-stack-kits/higgs"
          clone lepton "${UF_ROOT}/L1-host-stack-kits/lepton"
          clone chronon-coordinator-macros "${UF_ROOT}/L1-host-stack-kits/chronon-coordinator-macros"
          clone chronon-valence-identity "${UF_ROOT}/L1-host-stack-kits/chronon-valence-identity"
          clone boson-valence-identity "${UF_ROOT}/L1-host-stack-kits/boson-valence-identity"
          clone photon-leptos "${UF_ROOT}/L1-host-stack-kits/photon-leptos"
          clone unified-field-product "${UF_ROOT}/L2-product-platform/unified-field-product"
          clone uf-notifications "${UF_ROOT}/L2-product-platform/uf-notifications"
          # Workspace member spectra-app path-depends on lepton-shell.
          clone lepton-uf-app "${UF_ROOT}/L2-product-platform/lepton-uf-app"
          # Workspace deps: gauge (ssr optional) + Higgs (path deps).
          clone gauge "${UF_ROOT}/L2-product-platform/gauge"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          components: rustfmt
      - name: cargo fmt --check
        working-directory: ${{ env.APP_WD }}
        run: >
          cargo fmt -p spectra-backend -p spectra-app -p protected-spectra-host
          -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spectra-uf-app into unified-field layout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ env.APP_WD }}
      - name: Checkout path-dep / patch siblings
        run: |
          set -euo pipefail
          clone() {
            local repo="$1" dest="$2"
            git clone --depth 1 "https://github.com/deathbreakfast/${repo}.git" "${dest}"
          }
          clone valence "${UF_ROOT}/L0-upstream-cores/valence"
          clone orbital "${UF_ROOT}/L0-upstream-cores/orbital"
          clone chronon "${UF_ROOT}/L0-upstream-cores/chronon"
          clone photon "${UF_ROOT}/L0-upstream-cores/photon"
          clone boson "${UF_ROOT}/L0-upstream-cores/boson"
          clone spectra "${UF_ROOT}/L0-upstream-cores/spectra"
          clone higgs "${UF_ROOT}/L1-host-stack-kits/higgs"
          clone lepton "${UF_ROOT}/L1-host-stack-kits/lepton"
          clone chronon-coordinator-macros "${UF_ROOT}/L1-host-stack-kits/chronon-coordinator-macros"
          clone chronon-valence-identity "${UF_ROOT}/L1-host-stack-kits/chronon-valence-identity"
          clone boson-valence-identity "${UF_ROOT}/L1-host-stack-kits/boson-valence-identity"
          clone photon-leptos "${UF_ROOT}/L1-host-stack-kits/photon-leptos"
          clone unified-field-product "${UF_ROOT}/L2-product-platform/unified-field-product"
          clone uf-notifications "${UF_ROOT}/L2-product-platform/uf-notifications"
          clone lepton-uf-app "${UF_ROOT}/L2-product-platform/lepton-uf-app"
          clone gauge "${UF_ROOT}/L2-product-platform/gauge"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          components: clippy
      # Preferred path from VERIFICATION.md (clippy -D warnings).
      - name: cargo clippy (spectra-backend + teaching host)
        working-directory: ${{ env.APP_WD }}
        run: |
          cargo clippy -p spectra-backend --all-targets -- -D warnings
          cargo clippy -p protected-spectra-host --all-targets -- -D warnings
      # Tracked debt: spectra-app clippy depends on the full Orbital / uf-product graph in CI.
      # Run locally when the UI graph is green; promote to required when warnings are zero.
      - name: cargo clippy (spectra-app SSR, non-blocking)
        continue-on-error: true
        working-directory: ${{ env.APP_WD }}
        run: cargo clippy -p spectra-app --features ssr --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spectra-uf-app into unified-field layout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ env.APP_WD }}
      - name: Checkout path-dep / patch siblings
        run: |
          set -euo pipefail
          clone() {
            local repo="$1" dest="$2"
            git clone --depth 1 "https://github.com/deathbreakfast/${repo}.git" "${dest}"
          }
          clone valence "${UF_ROOT}/L0-upstream-cores/valence"
          clone orbital "${UF_ROOT}/L0-upstream-cores/orbital"
          clone chronon "${UF_ROOT}/L0-upstream-cores/chronon"
          clone photon "${UF_ROOT}/L0-upstream-cores/photon"
          clone boson "${UF_ROOT}/L0-upstream-cores/boson"
          clone spectra "${UF_ROOT}/L0-upstream-cores/spectra"
          clone higgs "${UF_ROOT}/L1-host-stack-kits/higgs"
          clone lepton "${UF_ROOT}/L1-host-stack-kits/lepton"
          clone chronon-coordinator-macros "${UF_ROOT}/L1-host-stack-kits/chronon-coordinator-macros"
          clone chronon-valence-identity "${UF_ROOT}/L1-host-stack-kits/chronon-valence-identity"
          clone boson-valence-identity "${UF_ROOT}/L1-host-stack-kits/boson-valence-identity"
          clone photon-leptos "${UF_ROOT}/L1-host-stack-kits/photon-leptos"
          clone unified-field-product "${UF_ROOT}/L2-product-platform/unified-field-product"
          clone uf-notifications "${UF_ROOT}/L2-product-platform/uf-notifications"
          clone lepton-uf-app "${UF_ROOT}/L2-product-platform/lepton-uf-app"
          clone gauge "${UF_ROOT}/L2-product-platform/gauge"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: cargo test (sibling-source UI contracts)
        working-directory: ${{ env.APP_WD }}
        run: cargo test -p spectra-backend --test workspace_members --test product_surface
      - name: cargo test (spectra-backend contracts)
        working-directory: ${{ env.APP_WD }}
        run: cargo test -p spectra-backend
      - name: cargo test (spectra-app SSR unit tests)
        working-directory: ${{ env.APP_WD }}
        run: cargo test -p spectra-app --features ssr
      - name: cargo test (spectra-uf-app-e2e boundary)
        working-directory: ${{ env.APP_WD }}
        run: cargo test -p spectra-uf-app-e2e --features ssr --test boundary_contract
      - name: cargo check (spectra-app + e2e host SSR)
        working-directory: ${{ env.APP_WD }}
        run: |
          cargo check -p spectra-app --features ssr
          cargo check -p spectra-uf-app-e2e --features ssr
      - name: cargo check + run (protected-spectra-host)
        working-directory: ${{ env.APP_WD }}
        run: |
          cargo check -p protected-spectra-host
          cargo run -p protected-spectra-host

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spectra-uf-app into unified-field layout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ env.APP_WD }}
      - name: Checkout path-dep / patch siblings
        run: |
          set -euo pipefail
          clone() {
            local repo="$1" dest="$2"
            git clone --depth 1 "https://github.com/deathbreakfast/${repo}.git" "${dest}"
          }
          clone valence "${UF_ROOT}/L0-upstream-cores/valence"
          clone orbital "${UF_ROOT}/L0-upstream-cores/orbital"
          clone chronon "${UF_ROOT}/L0-upstream-cores/chronon"
          clone photon "${UF_ROOT}/L0-upstream-cores/photon"
          clone boson "${UF_ROOT}/L0-upstream-cores/boson"
          clone spectra "${UF_ROOT}/L0-upstream-cores/spectra"
          clone higgs "${UF_ROOT}/L1-host-stack-kits/higgs"
          clone lepton "${UF_ROOT}/L1-host-stack-kits/lepton"
          clone chronon-coordinator-macros "${UF_ROOT}/L1-host-stack-kits/chronon-coordinator-macros"
          clone chronon-valence-identity "${UF_ROOT}/L1-host-stack-kits/chronon-valence-identity"
          clone boson-valence-identity "${UF_ROOT}/L1-host-stack-kits/boson-valence-identity"
          clone photon-leptos "${UF_ROOT}/L1-host-stack-kits/photon-leptos"
          clone unified-field-product "${UF_ROOT}/L2-product-platform/unified-field-product"
          clone uf-notifications "${UF_ROOT}/L2-product-platform/uf-notifications"
          clone lepton-uf-app "${UF_ROOT}/L2-product-platform/lepton-uf-app"
          clone gauge "${UF_ROOT}/L2-product-platform/gauge"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
      - name: Install cargo-leptos
        run: cargo install cargo-leptos --locked --version 0.3.6
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ env.APP_WD }}/spectra-uf-app-e2e/end2end/package-lock.json
      - name: Install npm dependencies
        working-directory: ${{ env.APP_WD }}/spectra-uf-app-e2e/end2end
        run: npm ci
      - name: Get Playwright version
        id: pw-version
        working-directory: ${{ env.APP_WD }}/spectra-uf-app-e2e/end2end
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> $GITHUB_OUTPUT
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}-spectra-uf-app
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ${{ env.APP_WD }}/spectra-uf-app-e2e/end2end
        run: npx playwright install --with-deps chromium
      - name: Install Playwright OS deps when cache hit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: ${{ env.APP_WD }}/spectra-uf-app-e2e/end2end
        run: npx playwright install-deps chromium
      - name: cargo check (spectra-app + e2e host SSR)
        working-directory: ${{ env.APP_WD }}
        run: |
          cargo check -p spectra-app --features ssr
          cargo check -p spectra-uf-app-e2e --features ssr
      - name: cargo leptos end-to-end
        working-directory: ${{ env.APP_WD }}
        env:
          CI: true
        run: cargo leptos end-to-end --project spectra-uf-app-e2e
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-spectra-uf-app-${{ github.run_id }}
          path: |
            ${{ env.APP_WD }}/spectra-uf-app-e2e/end2end/playwright-report/
            ${{ env.APP_WD }}/spectra-uf-app-e2e/end2end/test-results/
          if-no-files-found: ignore

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout spectra-uf-app into unified-field layout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ${{ env.APP_WD }}
      - name: Checkout path-dep / patch siblings
        run: |
          set -euo pipefail
          clone() {
            local repo="$1" dest="$2"
            git clone --depth 1 "https://github.com/deathbreakfast/${repo}.git" "${dest}"
          }
          clone valence "${UF_ROOT}/L0-upstream-cores/valence"
          clone orbital "${UF_ROOT}/L0-upstream-cores/orbital"
          clone chronon "${UF_ROOT}/L0-upstream-cores/chronon"
          clone photon "${UF_ROOT}/L0-upstream-cores/photon"
          clone boson "${UF_ROOT}/L0-upstream-cores/boson"
          clone spectra "${UF_ROOT}/L0-upstream-cores/spectra"
          clone higgs "${UF_ROOT}/L1-host-stack-kits/higgs"
          clone lepton "${UF_ROOT}/L1-host-stack-kits/lepton"
          clone chronon-coordinator-macros "${UF_ROOT}/L1-host-stack-kits/chronon-coordinator-macros"
          clone chronon-valence-identity "${UF_ROOT}/L1-host-stack-kits/chronon-valence-identity"
          clone boson-valence-identity "${UF_ROOT}/L1-host-stack-kits/boson-valence-identity"
          clone photon-leptos "${UF_ROOT}/L1-host-stack-kits/photon-leptos"
          clone unified-field-product "${UF_ROOT}/L2-product-platform/unified-field-product"
          clone uf-notifications "${UF_ROOT}/L2-product-platform/uf-notifications"
          clone lepton-uf-app "${UF_ROOT}/L2-product-platform/lepton-uf-app"
          clone gauge "${UF_ROOT}/L2-product-platform/gauge"
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (pin)
        with:
          toolchain: nightly
      - name: cargo doc (spectra-backend, deny broken intra-doc links)
        working-directory: ${{ env.APP_WD }}
        env:
          RUSTDOCFLAGS: "-D rustdoc::broken-intra-doc-links"
        run: cargo doc -p spectra-backend --no-deps
